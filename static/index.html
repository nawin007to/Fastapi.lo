<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>จัดการข้อมูลพนักงาน</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <main class="page">
    <header>
      <div class="eyebrow">FASTAPI + SQLITE</div>
      <h1>จัดการข้อมูลพนักงาน</h1>
      <p class="intro">กรอกข้อมูลทางซ้าย แล้วดูข้อมูลที่บันทึกในฐานข้อมูลทางขวา</p>
    </header>

    <div class="layout">
      <section class="card form-card" aria-labelledby="form-title">
        <h2 id="form-title">เพิ่มพนักงาน</h2>
        <form id="employee-form">
          <label for="name">ชื่อ</label>
          <input id="name" name="name" type="text" minlength="1" required autocomplete="name" placeholder="เช่น Nawin">

          <label for="age">อายุ</label>
          <input id="age" name="age" type="number" min="0" step="1" required placeholder="เช่น 18">

          <label for="position">ตำแหน่ง</label>
          <input id="position" name="position" type="text" minlength="1" required placeholder="เช่น Programmer">

          <label for="gender">เพศ <span class="optional-note">(ไม่บังคับ)</span></label>
          <select id="gender" name="gender">
            <option value="">ไม่ระบุ</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>

          <button class="submit" id="submit-button" type="submit">บันทึกข้อมูล</button>
          <p class="status" id="form-status" role="status" aria-live="polite"></p>
        </form>
        <p class="hint">ฟอร์มนี้ส่ง JSON ไปที่ <code>POST /employees</code> ส่วนตารางโหลดข้อมูลจาก <code>GET /employees</code></p>
      </section>

      <section class="card list-card" aria-labelledby="list-title">
        <div class="list-header">
          <h2 id="list-title">รายชื่อพนักงาน</h2>
          <button class="refresh" id="refresh-button" type="button">รีเฟรช</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>ชื่อ</th><th>อายุ</th><th>ตำแหน่ง</th><th>เพศ</th></tr></thead>
            <tbody id="employee-list"><tr><td class="empty" colspan="5">กำลังโหลดข้อมูล...</td></tr></tbody>
          </table>
        </div>
        <p class="status list-status" id="list-status" role="status" aria-live="polite"></p>
      </section>
    </div>
  </main>

</body>
</html>
