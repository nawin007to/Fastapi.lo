[project]
name = "fastapi-starter"
version = "0.1.0"
description = "A FastAPI learning project"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "sqlmodel>=0.0.48",
]

[project.scripts]
fastapi-starter = "fastapi_starter:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true
